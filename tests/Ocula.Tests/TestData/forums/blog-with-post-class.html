<!DOCTYPE html>
<!-- A blog or gallery page, NOT a forum: its entries use a "post" class (as many blog themes do), the lead picture sits in the entry's
     <header>, and a row of 100 px thumbnails links to full-size pictures. None of the forum rules should touch it. -->
<html lang="en">
<head><meta charset="utf-8"><title>Spring trip: day one</title></head>
<body>
<div class="post">
  <header class="entry-header"><img src="https://blog.test/img/day1-hero.jpg" width="1200" height="800" alt="Day one"></header>
  <div class="entry-content">
    <p>Photos from the first day.</p>
    <a href="https://blog.test/img/full/a.jpg"><img src="https://blog.test/img/thumb/a.jpg" width="100" height="100" alt="a"></a>
    <a href="https://blog.test/img/full/b.jpg"><img src="https://blog.test/img/thumb/b.jpg" width="100" height="100" alt="b"></a>
  </div>
</div>
<div class="gallery-strip">
  <img src="https://blog.test/img/day1-extra.jpg" width="600" height="400" alt="Extra">
  <img src="https://blog.test/img/site-icon-badge.png" width="200" height="200" alt="badge">
</div>
<nav class="site-nav"><img src="https://blog.test/img/nav-picture.jpg" width="400" height="300" alt="Nav picture"></nav>
</body>
</html>
